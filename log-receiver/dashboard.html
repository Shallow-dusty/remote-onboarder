<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接入记录 · Remote Onboarder</title>
<style>
:root{color-scheme:dark;--bg:#111720;--panel:#1b2432;--line:#334155;--muted:#b1bed1;--accent:#93b4ff;font:15px/1.6 system-ui,sans-serif;color:#edf2fa;background:var(--bg)}*{box-sizing:border-box}body{margin:0}header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;gap:20px;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}h2{font-size:17px;margin:0}p{margin:4px 0;color:var(--muted)}small{color:var(--muted)}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:inherit;padding:10px 14px}button:hover{border-color:var(--accent)}button[aria-pressed=true]{background:#293d61;border-color:var(--accent)}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.workspace{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:75vh}aside{padding:24px;border-right:1px solid var(--line)}label{display:block;font-size:13px;color:var(--muted)}input[type=search]{width:100%;padding:10px;margin:6px 0 18px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:inherit}#sessions{display:grid;gap:8px;max-height:65vh;overflow:auto}#sessions button{text-align:left;overflow-wrap:anywhere}#sessions small{display:block;font-size:12px}main{min-width:0;padding:24px 32px}.log-head{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:12px}.log-head>div{min-width:0}#selected{overflow-wrap:anywhere}.controls{display:flex;gap:10px;align-items:center}.controls label{white-space:nowrap}pre{margin:0;border:1px solid var(--line);border-radius:12px;background:#0c121b;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:65vh;min-height:280px;overflow:auto;font:13px/1.8 ui-monospace,Consolas,monospace}#status{font-size:13px;color:var(--muted);margin:0 0 12px}#status.error{color:#ffb3b3}.privacy{padding:16px 32px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.skip{position:fixed;top:-100px;left:12px;background:var(--panel);color:var(--accent);padding:12px}.skip:focus{top:12px}a{color:var(--accent)}@media(max-width:760px){header{padding:20px;align-items:start;flex-direction:column}.workspace{grid-template-columns:1fr}aside{padding:20px;border-right:0;border-bottom:1px solid var(--line)}#sessions{max-height:180px}main{padding:20px}.log-head{align-items:start;flex-direction:column}.controls{flex-wrap:wrap}pre{padding:12px}.privacy{padding:16px 20px}}
</style></head><body><a class="skip" href="#main">跳到日志</a>
<header><div><small>REMOTE ONBOARDER / 接入记录</small><h1>看见每一步，而不是猜测进度</h1><p>选择一次运行，查看目标电脑上报的事件。</p></div><button id="refresh" type="button">立即刷新</button></header>
<div class="workspace"><aside aria-label="运行记录"><label for="search">查找会话</label><input id="search" type="search" placeholder="输入会话编号或电脑名" autocomplete="off"><div id="sessions">正在读取记录…</div></aside>
<main id="main" tabindex="-1"><div class="log-head"><div><h2 id="selected">尚未选择会话</h2><small id="count">日志不会自动代表远端连接成功</small></div><div class="controls"><button id="pause" aria-pressed="false">暂停刷新</button><label><input id="follow" type="checkbox" checked> 跟随最新</label></div></div><p id="status" role="status" aria-live="polite">正在连接日志接收器…</p><pre id="log" tabindex="0" aria-label="会话事件">从左侧选择一条记录。没有记录时，请确认目标电脑已启用远程日志。</pre></main></div>
<footer class="privacy">记录包含设备名、用户名和网络信息。仅供受信任的协助者访问；请勿将面板公开到互联网。页面隐藏时暂停轮询。</footer>
<script>
let selected='',items=[],paused=false,busy=false,revision=0;
const el=id=>document.getElementById(id);
async function request(path){const response=await fetch(path,{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!response.ok)throw new Error('HTTP '+response.status);return response;}
function renderSessions(){const query=el('search').value.toLowerCase();const fragment=document.createDocumentFragment();for(const item of items.filter(x=>x.sessionId.toLowerCase().includes(query))){const button=document.createElement('button');button.type='button';button.setAttribute('aria-pressed',String(selected===item.sessionId));button.append(document.createTextNode(item.sessionId));const note=document.createElement('small');note.textContent=new Date(item.updatedAt).toLocaleString()+' · '+Math.ceil(item.bytes/1024)+' KB';button.append(note);button.addEventListener('click',()=>{selected=item.sessionId;revision++;el('selected').textContent=selected;el('log').textContent='正在读取所选会话…';renderSessions();void refresh();});fragment.append(button);}if(!fragment.childNodes.length){const empty=document.createElement('p');empty.textContent=query?'没有匹配的会话。':'还没有接入记录。';fragment.append(empty);}const focus=document.activeElement;const active=focus&&focus.parentElement===el('sessions')?focus.textContent:null;el('sessions').replaceChildren(fragment);if(active){[...el('sessions').children].find(x=>x.textContent===active)?.focus({preventScroll:true});}}
async function refresh(){if(busy||document.hidden)return;busy=true;const current=selected,version=revision;el('refresh').disabled=true;try{items=await(await request('sessions')).json();renderSessions();if(current){const text=await(await request('sessions/'+encodeURIComponent(current))).text();if(version===revision){const lines=text.trim().split('\n').filter(Boolean);el('log').textContent=lines.map(line=>{try{const x=JSON.parse(line);return [x.timestamp||x.receivedAt,'['+(x.level||'INFO')+']',x.step||'',x.message||''].join('  ');}catch{return line;}}).join('\n')||'此会话尚无事件。';el('count').textContent=lines.length+' 条事件 · 仅表示目标电脑上报的状态';if(el('follow').checked)el('log').scrollTop=el('log').scrollHeight;}}el('status').className='';el('status').textContent='最近同步 '+new Date().toLocaleTimeString()+(paused?' · 自动刷新已暂停':' · 每 2 秒刷新');}catch(error){el('status').className='error';el('status').textContent='同步失败，保留上次内容。'+error.message+'；可点击立即刷新重试。';}finally{busy=false;el('refresh').disabled=false;if(version!==revision)void refresh();}}
el('search').addEventListener('input',renderSessions);el('refresh').addEventListener('click',()=>void refresh());el('pause').addEventListener('click',()=>{paused=!paused;el('pause').setAttribute('aria-pressed',String(paused));el('pause').textContent=paused?'恢复刷新':'暂停刷新';el('status').textContent=paused?'自动刷新已暂停；仍可手动刷新。':'正在恢复同步…';if(!paused)void refresh();});setInterval(()=>{if(!paused)void refresh();},2000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!paused)void refresh();});void refresh();
</script></body></html>
